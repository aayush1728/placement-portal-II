<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement Portal</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />

  <style>
    :root {
      --ppa-primary: #1a237e;
      --ppa-accent:  #3949ab;
      --ppa-light:   #e8eaf6;
    }

    body { background: #f4f6fb; font-family: 'Segoe UI', sans-serif; }

    /* Sidebar */
    .sidebar {
      min-height: 100vh;
      background: var(--ppa-primary);
      color: #fff;
      width: 250px;
      transition: width 0.2s;
      flex-shrink: 0;
    }
    .sidebar .brand { font-size: 1.2rem; font-weight: 700; padding: 1.4rem 1rem; letter-spacing: 1px; }
    .sidebar .nav-link { color: rgba(255,255,255,.8); border-radius: 6px; margin: 2px 8px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,.15); color: #fff; }
    .sidebar .nav-link i { margin-right: 8px; }

    /* Cards */
    .stat-card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .stat-card .icon-wrap { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }

    /* Navbar top */
    .top-bar { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.08); padding: .75rem 1.5rem; }

    /* Badges */
    .badge-applied  { background: #1565c0; }
    .badge-shortlisted { background: #f57c00; }
    .badge-selected { background: #2e7d32; }
    .badge-rejected { background: #c62828; }
    .badge-interview_scheduled { background: #6a1b9a; }
    .badge-pending  { background: #616161; }
    .badge-approved { background: #2e7d32; }

    /* Drive card */
    .drive-card { transition: transform .15s; }
    .drive-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }

    /* Loader */
    .ppa-loader { display: flex; justify-content: center; align-items: center; min-height: 200px; }

    /* Toast */
    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; }

    /* Login page */
    .auth-card { border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.12); max-width: 460px; }
    .auth-brand { color: var(--ppa-primary); font-weight: 800; font-size: 1.8rem; }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Vue 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
  <!-- Vue Router 4 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue-router/4.3.0/vue-router.global.prod.min.js"></script>
  <!-- Axios -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- App Modules -->
  <script src="/src/store.js"></script>
  <script src="/src/api.js"></script>
  <script src="/src/components/common/Navbar.js"></script>
  <script src="/src/components/common/Toast.js"></script>
  <script src="/src/components/auth/LoginPage.js"></script>
  <script src="/src/components/auth/StudentRegister.js"></script>
  <script src="/src/components/auth/CompanyRegister.js"></script>
  <script src="/src/components/admin/AdminDashboard.js"></script>
  <script src="/src/components/admin/AdminCompanies.js"></script>
  <script src="/src/components/admin/AdminStudents.js"></script>
  <script src="/src/components/admin/AdminDrives.js"></script>
  <script src="/src/components/admin/AdminApplications.js"></script>
  <script src="/src/components/company/CompanyDashboard.js"></script>
  <script src="/src/components/company/CompanyDrives.js"></script>
  <script src="/src/components/company/DriveForm.js"></script>
  <script src="/src/components/company/DriveApplications.js"></script>
  <script src="/src/components/student/StudentDashboard.js"></script>
  <script src="/src/components/student/AvailableDrives.js"></script>
  <script src="/src/components/student/MyApplications.js"></script>
  <script src="/src/components/student/StudentProfile.js"></script>
  <script src="/src/router.js"></script>
  <script src="/src/main.js"></script>
</body>
</html>
